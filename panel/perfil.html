<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Perfil de Elevación — Panel</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/panel.css">
  <style>
    .perf-page        { max-width: 1320px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
    .perf-header      { margin-bottom: 1.1rem; }
    .perf-title       { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700;
                        margin: 0 0 0.2rem; color: var(--text); line-height: 1.25; }
    .perf-meta        { font-size: 0.83rem; color: var(--text-muted); margin: 0 0 0.1rem; }

    /* search bar */
    .perf-search      { display: flex; gap: 0.5rem; margin: 0 0 1.5rem; }
    .perf-search input { flex: 1; min-width: 0; background: var(--bg-input);
                         border: 1px solid var(--border); border-radius: var(--radius);
                         color: var(--text); font-size: 0.88rem; padding: 0.45rem 0.75rem;
                         font-family: var(--font-body); }
    .perf-search input:focus { outline: none; border-color: var(--accent); }

    /* SVG card */
    .perf-svg-wrap    { background: var(--bg-card); border: 1px solid var(--border);
                        border-radius: var(--radius-lg); padding: 1.25rem 0.75rem 0.75rem;
                        overflow-x: auto; }
    .perf-svg-wrap svg { min-width: 600px; width: 100%; height: auto; }

    /* Annotations */
    .perf-section     { margin-top: 1.75rem; }
    .perf-section-title { font-family: var(--font-display); font-size: 0.72rem; font-weight: 700;
                          text-transform: uppercase; letter-spacing: 0.07em;
                          color: var(--text-muted); margin: 0 0 0.6rem; }
    .perf-annot-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .perf-annot-grid--single { grid-template-columns: 1fr; }
    .perf-annot-box   { background: var(--bg-card); border: 1px solid var(--border);
                        border-radius: var(--radius); padding: 0.75rem 1rem; }
    .perf-annot-grid--single .perf-annot-box { columns: 2; column-gap: 1.5rem; }
    .perf-annot-empty { color: var(--text-dim); font-size: 0.82rem; margin: 0; }
    .perf-annot-item  { font-size: 0.82rem; padding: 0.28rem 0;
                        border-bottom: 1px solid var(--border); color: var(--text);
                        break-inside: avoid; }
    .perf-annot-item:last-child { border-bottom: none; }
    .perf-annot-item b { color: var(--text-muted); padding-right: 0.55rem; margin-right: 0.55rem; border-right: 1px solid var(--border); }
    .perf-empty       { color: var(--text-muted); font-size: 0.9rem; padding: 3rem 0; text-align: center; margin: 0; }
    @media (max-width: 640px) { .perf-annot-grid { grid-template-columns: 1fr; } .perf-annot-grid--single .perf-annot-box { columns: 1; } }
  </style>
</head>
<body>

  <header class="panel-topbar">
    <div style="display:flex;align-items:center;gap:1.5rem">
      <a href="/panel/app.html" class="panel-topbar__logo" style="text-decoration:none">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-0.15em;margin-right:0.3em"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-0.15em;margin-right:0.3em"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
        <span class="logo-text">Panel</span>
      </a>
      <nav class="panel-tabs">
        <a class="panel-tab" href="/panel/app.html">← Tareas</a>
        <span class="panel-tab active">Perfil de elevación</span>
      </nav>
    </div>
    <div class="panel-topbar__right">
      <button class="theme-toggle" title="Cambiar tema"></button>
      <button id="logoutBtn" class="btn btn--ghost" style="font-size:0.82rem">Salir</button>
    </div>
  </header>

  <main class="perf-page">
    <div class="perf-search">
      <input type="text" id="rdIdInput" placeholder="ID o slug de jornada…" autocomplete="off" spellcheck="false">
      <button class="btn btn--primary" id="loadBtn">Cargar</button>
    </div>
    <div id="perfilContent"></div>
  </main>

  <script src="../js/config.js"></script>
  <script type="module" src="../js/perfil.js"></script>
</body>
</html>
