# Instancia de prueba, aparte del nginx de producción: otro puerto, otro proceso y
# sin privilegios. Se arranca con:
#   nginx -e /var/tmp/cc-prototipo/error.log -p /var/tmp/cc-prototipo/ -c nginx.conf
# Lee lo que publica el servicio cc-publicador; lo demás, del sitio base (vps/base.sh).
# Las lecturas públicas de datos pasan por aquí, con una caché de pocos segundos.
worker_processes 2;
pid /var/tmp/cc-prototipo/nginx.pid;
error_log /var/tmp/cc-prototipo/error.log warn;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_body_temp_path /var/tmp/cc-prototipo/tmp/cuerpo;
  proxy_temp_path /var/tmp/cc-prototipo/tmp/proxy;
  fastcgi_temp_path /var/tmp/cc-prototipo/tmp/fastcgi;
  uwsgi_temp_path /var/tmp/cc-prototipo/tmp/uwsgi;
  scgi_temp_path /var/tmp/cc-prototipo/tmp/scgi;
  proxy_cache_path /var/tmp/cc-prototipo/cache-datos levels=1:2 keys_zone=datos:10m max_size=200m inactive=1h use_temp_path=off;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

  include /var/tmp/cc-prototipo/nginx-mapas.inc;

  server {
    listen 8443 ssl http2;
    ssl_certificate /var/tmp/cc-prototipo/certificado.pem;
    ssl_certificate_key /var/tmp/cc-prototipo/clave.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:prueba:1m;

    root /var/lib/cc-publicador/arbol;
    set $sitio_base /var/lib/cc-publicador/base;
    include /var/tmp/cc-prototipo/nginx-sitio.inc;
  }

  # Sitio base solo, sin lo publicado por página: para comparar las dos versiones.
  server {
    listen 8444 ssl http2;
    ssl_certificate /var/tmp/cc-prototipo/certificado.pem;
    ssl_certificate_key /var/tmp/cc-prototipo/clave.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/lib/cc-publicador/base;
    index index.html;
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    etag on;
    set $supabase bcecwlkynpgovnzhbpah.supabase.co;

    # Lecturas públicas: copia de pocos segundos y, ante un fallo, la última buena.
    location /rest/v1/ {
      proxy_pass https://$supabase;
      proxy_set_header Host $supabase;
      proxy_ssl_server_name on;
      proxy_ssl_name $supabase;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_cache datos;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$request_uri|$http_range|$http_accept|$http_prefer|$http_range_unit";
      proxy_cache_valid 200 206 3s;
      # PostgREST repite la URL en Content-Location: una lista larga de ids no cabe en los 4 KB por defecto.
      proxy_buffer_size 64k;
      proxy_buffers 8 64k;
      proxy_busy_buffers_size 128k;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache_bypass $http_authorization;
      proxy_no_cache $http_authorization;
      add_header X-Cache $upstream_cache_status always;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/index.html =404;
      error_page 404 /404.html;
    }
  }
}
