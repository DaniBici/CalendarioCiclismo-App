# Web de calendariociclismo.app. No se habilita hasta el corte: docs/runbooks/publicador-vps.md.
include /etc/nginx/cc-publicador/nginx-mapas.inc;

proxy_cache_path /var/cache/nginx/cc-datos levels=1:2 keys_zone=datos:10m max_size=200m inactive=1h use_temp_path=off;

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name calendariociclismo.app;
  ssl_certificate /etc/letsencrypt/live/calendariociclismo.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/calendariociclismo.app/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  root /var/lib/cc-publicador/arbol;
  set $sitio_base /var/lib/cc-publicador/base;
  include /etc/nginx/cc-publicador/nginx-sitio.inc;
}

# www redirige al dominio, como hacía Pages, salvo las asociaciones de las apps: Apple y Android no
# siguen redirecciones al leerlas, y ambas apps declaran también www.calendariociclismo.app.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.calendariociclismo.app;
  ssl_certificate /etc/letsencrypt/live/calendariociclismo.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/calendariociclismo.app/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  location = /.well-known/apple-app-site-association {
    root /var/lib/cc-publicador/base;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
  }
  location = /.well-known/assetlinks.json {
    root /var/lib/cc-publicador/base;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    return 301 https://calendariociclismo.app$request_uri;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name calendariociclismo.app www.calendariociclismo.app;
  return 301 https://calendariociclismo.app$request_uri;
}
