# Fragmentos para /etc/nginx/sites-available/assets-proxy. No es un fichero
# completo: se añaden a la configuración existente (docs/runbooks/assets-canonical-vps.md).

# 1) A nivel de `http` (antes del bloque `server`, en el mismo fichero).
#    Más de 2.000 rutas de unos 100 caracteres: ampliar el hash del map.
map_hash_max_size 8192;
map_hash_bucket_size 256;

map $uri $cc_canonical_link {
    default "";
    include /etc/nginx/cc-assets-canonicals.map;
}

# 2) Dentro del `location` del `server` de assets que ya declara los
#    `add_header` de CORS (Access-Control-Allow-*). nginx no hereda `add_header`
#    de un nivel superior si el bloque declara los suyos: la línea va junto a ellos.
#    Con valor vacío (ruta sin canonical) nginx no emite la cabecera.
add_header Link $cc_canonical_link always;
