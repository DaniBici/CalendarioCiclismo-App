  <script>
  // Fallback de URLs limpias — redirige antes de pintar nada.
  (function () {
    var p = location.pathname;
    var m;
    m = p.match(/^\/perfil\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/perfil.html?id=' + m[1]); return; }
    m = p.match(/^\/mapa\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/mapa.html?id=' + encodeURIComponent(m[1])); return; }
    m = p.match(/^\/en\/route-map\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/mapa.html?id=' + encodeURIComponent(m[1]) + '&lang=en'); return; }
    m = p.match(/^\/orden-salida\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/orden-salida.html?slug=' + encodeURIComponent(m[1])); return; }
    // Resultados: /resultados/<slug>/ con segmento de etapa opcional (etapa-N|prologo).
    m = p.match(/^\/resultados\/([^\/?#]+)(?:\/(etapa-\d+|prologo))?\/?$/);
    if (m) {
      var rs = '/resultados.html?slug=' + encodeURIComponent(m[1]);
      if (m[2]) { rs += '&stage=' + (m[2] === 'prologo' ? '0' : m[2].replace('etapa-', '')); }
      location.replace(rs); return;
    }
    m = p.match(/^\/en\/results\/([^\/?#]+)(?:\/(stage-\d+|prologue))?\/?$/);
    if (m) {
      var rse = '/en/results/?slug=' + encodeURIComponent(m[1]);
      if (m[2]) { rse += '&stage=' + (m[2] === 'prologue' ? '0' : m[2].replace('stage-', '')); }
      location.replace(rse); return;
    }
    m = p.match(/^\/en\/start-order\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/en/start-order/?slug=' + encodeURIComponent(m[1])); return; }
    m = p.match(/^\/en\/stage\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/en/stage/?slug=' + encodeURIComponent(m[1])); return; }
    m = p.match(/^\/en\/race\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/en/race/?slug=' + encodeURIComponent(m[1])); return; }
    m = p.match(/^\/en\/startlist\/([^\/?#]+)\/?$/);
    if (m) { location.replace('/en/startlist/?slug=' + encodeURIComponent(m[1])); return; }
    if (/^\/campeonatos-nacionales-2026\/?$/.test(p)) { location.replace('/campeonatos-nacionales-2026.html'); return; }
    // Buscador ARCHIVADO (2026-07-17): hoy /buscar.html y /en/search/ siguen
    // VIVOS y no llegan aquí — esta regla es la red de seguridad para el día en
    // que se borren, y solo entonces actúa. Destino = la home (su equivalente
    // más cercano: el buscador no se mudó a ninguna página concreta).
    if (/^\/buscar(\.html)?\/?$/.test(p)) { location.replace('/'); return; }
    if (/^\/en\/search\/?$/.test(p)) { location.replace('/en/'); return; }
  })();
  </script>
