<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — Calendario Ciclismo App</title>
  <!-- La vista Mes vive ahora en /en/calendar/ (subvista mes). Este shell
       conserva las URLs antiguas (?month=YYYY-MM&cat=) redirigiendo con params. -->
  <link rel="canonical" href="https://calendariociclismo.app/en/calendar/">
  <link rel="alternate" hreflang="en" href="https://calendariociclismo.app/en/calendar/"/>
  <link rel="alternate" hreflang="es" href="https://calendariociclismo.app/calendario/"/>
  <link rel="alternate" hreflang="x-default" href="https://calendariociclismo.app/calendario/"/>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var q = new URLSearchParams();
      q.set('vista', 'mes');
      var m = p.get('month');
      if (m && /^\d{4}-\d{2}$/.test(m)) q.set('mes', m);
      if (p.get('cat')) q.set('cat', p.get('cat'));
      location.replace('/en/calendar/?' + q.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/en/calendar/?vista=mes">
  <meta name="robots" content="noindex, follow">
</head>
<body>
  <p><a href="/en/calendar/?vista=mes">Calendario mensual</a></p>
</body>
</html>
